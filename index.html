<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gestão de Oficina — DE.MOTORS</title>
<meta name="theme-color" content="#2C50A4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DE.MOTORS">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ===== Tema igual ao Plano de Rotas: azul-900, pedra (stone), âmbar, esmeralda, rosa ===== */
:root{
  --bg:#fafaf9;          /* stone-50  */
  --panel:#ffffff;
  --panel-2:#f5f5f4;     /* stone-100 */
  --border:#e7e5e4;      /* stone-200 */
  --border-strong:#d6d3d1; /* stone-300 */
  --text:#292524;        /* stone-800 */
  --text-dim:#78716c;    /* stone-500 */
  --orange:#1e3a8a;      /* azul da marca (blue-900); nome mantido por compatibilidade */
  --orange-dim:#eff6ff;  /* blue-50 */
  --blue:#1e3a8a;
  --teal:#1e3a8a;
  --yellow:#f59e0b;      /* amber-500 */
  --green:#059669;       /* emerald-600 */
  --red:#e11d48;         /* rose-600 */
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#fafaf9;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:pan-y;overflow-x:hidden;max-width:100vw;}
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;}

body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;}
h1,h2,h3,.headline{font-family:inherit;font-weight:700;letter-spacing:0;text-transform:none;}
button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius);}
input,select,textarea{
  font-family:inherit;background:#fff;border:1px solid var(--border-strong);color:var(--text);
  border-radius:8px;padding:10px 12px;font-size:16px;width:100%;
}
input[type=file]{padding:8px;font-size:13px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:var(--orange);}
label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:4px;margin-top:12px;}

/* ===== Cabeçalho azul (como o Plano de Rotas) ===== */
#topbar{background:#1e3a8a;color:#fff;position:sticky;top:0;z-index:20;padding:max(env(safe-area-inset-top),.5rem) 16px 10px;}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.top-logo{height:30px;width:auto;background:#fff;border-radius:8px;padding:4px 8px;display:block;flex-shrink:0;}
.top-user{margin-left:auto;text-align:right;min-width:0;line-height:1.15;}
.top-user b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-user span{display:block;font-size:11px;color:#bfdbfe;}
#logout-btn{background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;white-space:nowrap;}
#logout-btn:active{background:rgba(255,255,255,.26);}

/* ===== Cartão escuro com separadores em mosaico ===== */
#app{display:block;min-height:100vh;}
#shell{max-width:1100px;margin:0 auto;padding:12px 12px max(36px,env(safe-area-inset-bottom,0px));}
#navcard{background:#1c1917;color:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.12),0 2px 4px -2px rgba(0,0,0,.12);}
.navcard-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
#shell-title{font-size:16px;font-weight:700;}
.day-pill{background:#f59e0b;color:#1c1917;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap;}
.nav-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:10px;}
.navbtn{
  grid-column:span 4;position:relative;border-radius:12px;padding:8px 2px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:#292524;color:#fff;font-size:10px;font-weight:600;line-height:1.2;text-align:center;
}
.navbtn .ic{font-size:18px;line-height:1;}
.navbtn:active{background:#44403c;}
.navbtn.action{background:#059669;color:#fff;}
.navbtn.action:active{background:#047857;}
.navbtn.active{background:#f59e0b;color:#1c1917;}
.nav-grid.tabs7 .navbtn{grid-column:span 3;}
.nav-grid.tabs7 .navbtn:nth-child(n+5){grid-column:span 4;}
@media (min-width:760px){
  .nav-grid{grid-template-columns:repeat(var(--n,6),minmax(0,1fr));}
  .navbtn,.nav-grid.tabs7 .navbtn,.nav-grid.tabs7 .navbtn:nth-child(n+5){grid-column:span 1;padding:10px 4px;font-size:11px;}
}
.nav-badge{position:absolute;top:2px;right:6px;background:#f59e0b;color:#1c1917;border-radius:999px;padding:0 5px;font-size:9px;font-weight:700;line-height:1.5;}
.navbtn.active .nav-badge{background:#1c1917;color:#fff;}

#main{padding-top:14px;overflow-x:auto;}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.pagehead h2{font-size:16px;color:var(--text);}

/* ===== Botões ===== */
.btn{background:#1e3a8a;color:#fff;padding:11px 16px;font-size:14px;font-weight:600;border-radius:8px;}
.btn:active{background:#172554;}
.btn.secondary{background:#fff;color:#44403c;border:1px solid var(--border-strong);}
.btn.secondary:active{background:#f5f5f4;}
.btn.small{padding:7px 12px;font-size:13px;}
.btn.danger{background:#e11d48;color:#fff;}
.btn.danger:active{background:#be123c;}

/* ===== Login ===== */
#login-screen{width:100%;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;background:#fafaf9;}
.login-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 4px 6px -1px rgba(0,0,0,.08);}
.login-logo{width:100%;margin-bottom:16px;display:block;}
.login-card h1{margin-bottom:4px;color:#1e3a8a !important;letter-spacing:0 !important;font-size:18px !important;}
.login-card p{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
.role-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px;}
.role-opt{background:#fff;border:1px solid var(--border-strong);color:var(--text);padding:12px;border-radius:10px;text-align:left;font-size:14px;}
.role-opt.selected{border-color:var(--orange);background:var(--orange-dim);}
.user-pick{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:12px;text-align:left;font-size:14px;width:100%;margin-bottom:8px;}
.user-pick:active{background:#f5f5f4;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:#1e3a8a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.user-pick .u-role{color:var(--text-dim);font-size:12px;}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:18px 0;}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);display:inline-block;}
.pin-dots span.filled{background:#1e3a8a;border-color:#1e3a8a;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pin-pad button{background:#fff;border:1px solid var(--border);color:var(--text);padding:15px 0;font-size:18px;font-weight:600;border-radius:12px;}
.pin-pad button:active{background:#eff6ff;}
.back-link{background:none;color:var(--text-dim);font-size:13px;padding:0;margin-top:14px;text-align:center;width:100%;}

.team-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap;}
.team-row:last-child{border-bottom:none;}
.team-row .u-name{font-weight:700;font-size:14px;}
.team-row .u-role{color:var(--text-dim);font-size:12px;}

/* Separadores de filtro (estilo da barra de separadores do Plano de Rotas) */
.filter-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);margin-bottom:12px;border-radius:12px 12px 0 0;overflow-x:auto;}
.filter-tab{flex:1;background:transparent;color:var(--text-dim);padding:10px 6px;border-radius:0;font-size:12px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;}
.filter-tab.active{color:#1e3a8a;border-bottom-color:#1e3a8a;}

/* ===== Quadro (kanban) ===== */
.board{display:grid;grid-template-columns:1fr;gap:10px;}
.col{background:#fff;border:1px solid var(--border);border-radius:12px;min-width:0;}
.col-head{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.col-head .count{background:#f5f5f4;color:var(--text-dim);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:70px;}
.car-card{background:#fff;border:1px solid var(--border);border-left:4px solid #1e3a8a;border-radius:10px;padding:10px 12px;cursor:pointer;}
.car-card:active{background:#fafaf9;}
.car-card .plate{font-weight:700;font-size:14px;letter-spacing:1px;}
.car-card .model{font-size:12px;color:var(--text-dim);margin-top:2px;}
.car-card .meta{font-size:11px;color:var(--text-dim);margin-top:6px;display:flex;justify-content:space-between;gap:8px;}
.car-card .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.car-card .model{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.col-head span:first-child{min-width:0;}
@media (min-width:1000px){
  #shell{max-width:1500px;}
  .topbar-in{max-width:1500px;padding:0 12px;}
  .board{grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;}
  .col-head{font-size:11px;}
}
.status-waiting-diag{border-left-color:#f59e0b;}
.status-in-progress{border-left-color:#1e3a8a;}
.status-waiting-parts{border-left-color:#e11d48;}
.status-ready{border-left-color:#059669;}
.status-delivered{border-left-color:#a8a29e;opacity:.7;}

/* ===== Cartões e formulários ===== */
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow-x:auto;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}
.section-title{font-size:12px;font-weight:700;color:#1e3a8a;text-transform:uppercase;letter-spacing:.04em;margin:20px 0 4px;border-bottom:1px solid var(--border);padding-bottom:6px;}
.section-title:first-child{margin-top:0;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #f5f5f4;}
th{color:var(--text-dim);font-size:11px;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--border);}
.row-item{display:grid;grid-template-columns:1fr 70px 90px 30px;gap:8px;align-items:center;margin-bottom:6px;}
.addrow-btn{background:#fafaf9;color:#1e3a8a;border:1px dashed var(--border-strong);width:100%;padding:9px;font-size:13px;font-weight:600;margin-top:4px;border-radius:8px;}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid transparent;}
.pill-paid{background:#ecfdf5;color:#047857;border-color:#a7f3d0;}
.pill-pending{background:#fff1f2;color:#be123c;border-color:#fecdd3;}
.pill-partial{background:#fffbeb;color:#b45309;border-color:#fde68a;}
.photo-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-thumbs img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
.close-x{background:none;color:var(--text-dim);font-size:22px;padding:0 6px;}
.modal-overlay{position:fixed;inset:0;background:rgba(28,25,23,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 10px 24px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border:1px solid var(--border);border-radius:16px;max-width:720px;width:100%;padding:18px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.totals-box{background:#fafaf9;border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-top:10px;}
.totals-row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;}
.totals-row.grand{font-weight:800;font-size:17px;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;color:#1e3a8a;}
.search-bar{margin-bottom:12px;}
.hist-item{border-bottom:1px solid var(--border);padding:12px 0;}
.hist-item:last-child{border-bottom:none;}
.note-item{background:#fafaf9;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px;}
.note-item .meta{color:var(--text-dim);font-size:11px;margin-top:3px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.stock-row{display:grid;grid-template-columns:1fr 90px 90px 100px 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.stock-row.low{background:#fff1f2;}
.stock-row.header{font-size:11px;color:var(--text-dim);text-transform:uppercase;border-bottom:1px solid var(--border);}
.low-tag{background:#e11d48;color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;}
.reminder-card{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.reminder-card.overdue{background:#fff1f2;border-color:#fecdd3;border-left-color:#e11d48;}
.reminder-card .info b{display:block;font-size:14px;}
.reminder-card .info span{font-size:12px;color:var(--text-dim);}
.signature-pad{background:#fff;border-radius:8px;touch-action:none;width:100%;height:150px;display:block;}
.sig-wrap{border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;margin-top:6px;}
.photo-block{margin-top:10px;}
.photo-block .photo-cap{font-size:11px;color:var(--text-dim);margin-top:2px;}
.photo-item{display:inline-block;text-align:center;margin-right:8px;vertical-align:top;}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));background:#292524;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;display:none;z-index:100;max-width:90%;text-align:center;box-shadow:0 4px 6px -1px rgba(0,0,0,.2);}

/* ===== Ajustes para telemóvel ===== */
.row-item{grid-template-columns:minmax(0,1fr) 64px 92px 28px;}
.row-item.svc{grid-template-columns:minmax(0,1fr) 110px 28px;}
.row-item.nocost{grid-template-columns:minmax(0,1fr) 28px;}
.row-item.nocost.prt{grid-template-columns:minmax(0,1fr) 64px 28px;}
.stock-row.nocost{grid-template-columns:minmax(0,1fr) 80px 80px 28px;}
.stock-row.nocost .mini.cost,.stock-row.nocost>span.cost{display:none;}
@media (max-width:700px){.stock-row.nocost{grid-template-columns:1fr 1fr 28px;}}
input[readonly].ro{background:#f5f5f4;color:#78716c;}
.row-item input{padding:9px 8px;}
.stock-row{grid-template-columns:minmax(0,1fr) 80px 80px 110px 28px;}
.mini{margin:0;display:block;}
.mini span{display:none;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:2px;}
@media (max-width:700px){
  .stock-row.header{display:none;}
  .stock-row{grid-template-columns:1fr 1fr 1fr 28px;gap:6px 8px;padding:12px 4px;}
  .stock-row .inv-name{grid-column:1 / -1;}
  .mini span{display:block;}
  .rtable thead{display:none;}
  .rtable,.rtable tbody{display:block;}
  .rtable tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"plate pay" "car total" "owner status" "date date" "btn btn";gap:3px 10px;padding:12px 0;border-bottom:1px solid var(--border);}
  .rtable tr:last-child{border-bottom:none;}
  .rtable td{border:none;padding:0;font-size:13px;}
  .rtable .c-plate{grid-area:plate;font-size:15px;}
  .rtable .c-pay{grid-area:pay;text-align:right;}
  .rtable .c-car{grid-area:car;color:var(--text);}
  .rtable .c-total{grid-area:total;text-align:right;font-weight:700;color:#1e3a8a;}
  .rtable .c-owner{grid-area:owner;color:var(--text-dim);}
  .rtable .c-status{grid-area:status;text-align:right;color:var(--text-dim);font-size:12px;}
  .rtable .c-date{grid-area:date;color:var(--text-dim);font-size:12px;}
  .rtable .c-btn{grid-area:btn;margin-top:6px;}
  .rtable .c-btn .btn{width:100%;}
}

/* ===== Impressão (fatura / relatório de manutenção em PDF) ===== */
@media print{
  #app,#toast,#login-screen,.pagehead,.no-print{display:none !important;}
  .modal-overlay:not(:last-child){display:none !important;}
  html,body{background:#fff;color:#000;}
  .modal-overlay{position:static;background:none;padding:0;overflow:visible;}
  .modal{border:none;max-width:100%;padding:0;border-radius:0;}
  .panel{border:1px solid #ccc;box-shadow:none;}
}
</style>
</head>
<body>

/* ===================== Persistence ===================== */
function localLoad(){
  vehicles = JSON.parse(localStorage.getItem('oficina_vehicles') || '[]');
}
function localSave(){
  localStorage.setItem('oficina_vehicles', JSON.stringify(vehicles));
}

function subscribeVehicles(){
  if(FIREBASE_OK){
    db.collection('vehicles').orderBy('createdAt','desc').onSnapshot(snap=>{
      vehicles = snap.docs.map(d=>({id:d.id, ...d.data()}));
      updateRemindersBadge();
      render();
    }, err=>{
      console.error(err);
      toast('Erro a ligar ao Firebase — a usar dados locais.');
      localLoad(); updateRemindersBadge(); render();
    });
  } else {
    localLoad(); updateRemindersBadge(); render();
  }
}

async function saveVehicle(v){
  if(docSize(v) > MAX_DOC_BYTES){
    toast('Dados demasiado grandes (fotos a mais). Remova fotos.');
    throw new Error('doc-too-large');
  }
  if(FIREBASE_OK){
    if(v.id){
      const id = v.id; const copy = {...v}; delete copy.id;
      await db.collection('vehicles').doc(id).set(copy, {merge:true});
      return id;
    } else {
      v.createdAt = Date.now();
      const ref = await db.collection('vehicles').add(v);
      return ref.id;
    }
  } else {
    if(v.id){
      const idx = vehicles.findIndex(x=>x.id===v.id);
      vehicles[idx] = v;
    } else {
      v.id = 'local_'+Date.now();
      v.createdAt = Date.now();
      vehicles.unshift(v);
    }
    localSave(); render();
    return v.id;
  }
}

async function deleteVehicle(id){
  if(!isOwner()){ toast('Apenas o dono pode eliminar'); return; }
  if(FIREBASE_OK){
    await db.collection('vehicles').doc(id).delete();
  } else {
    vehicles = vehicles.filter(x=>x.id!==id);
    localSave(); render();
  }
}

    if(item.id){

      await db.collection('inventory').doc(id).set(copy,{merge:true});

function updateLowStockBadge(){
  const low = inventory.filter(i=>Number(i.qty)<=Number(i.minQty||0));
  const badge = document.getElementById('low-stock-badge');
  if(badge){
    if(low.length){ badge.style.display='inline-block'; badge.textContent = low.length; }
    else { badge.style.display='none'; }
  }
}
function updateRemindersBadge(){
  const due = getDueReminders();
  const badge = document.getElementById('reminders-badge');
  if(badge){
    if(due.length){ badge.style.display='inline-block'; badge.textContent = due.length; }
    else { badge.style.display='none'; }
  }
}
function getDueReminders(){
  const now = Date.now();
  const in30 = now + 30*24*60*60*1000;
  return vehicles.filter(v=>{
    if(!v.nextServiceDate || v.reminderDone) return false;
    const t = new Date(v.nextServiceDate).getTime();
    return t <= in30;
  }).sort((a,b)=> new Date(a.nextServiceDate) - new Date(b.nextServiceDate));
}

function pinPass(pin){ return 'DM-' + pin + '-oficina'; }
function aliasEmail(name){
  const slug = (name||'user').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,12) || 'user';
  return slug + '.' + Math.random().toString(36).slice(2,7) + '@demotors.app';
}
// Cria uma conta de login sem terminar a sessão do administrador (app secundária)
async function createAuthAccount(name, pin){
  const email = aliasEmail(name);
  const app2 = firebase.initializeApp(firebaseConfig, 'sec' + Date.now());
  try{
    const cred = await app2.auth().createUserWithEmailAndPassword(email, pinPass(pin));
    await app2.auth().signOut();
    return {uid: cred.user.uid, email};
  } finally { try{ await app2.delete(); }catch(e){} }
}
async function createStaffAccount(name, role, pin){
  if(!FIREBASE_OK){ return saveUserAccount({name, role, pin}); }
  const {uid, email} = await createAuthAccount(name, pin);
  await db.collection('staff').doc(uid).set({name, role, email});
  return uid;
}
function localLoadUsers(){ users = JSON.parse(localStorage.getItem('oficina_users') || '[]'); }
function localSaveUsers(){ localStorage.setItem('oficina_users', JSON.stringify(users)); }

function subscribeUsers(){
  if(FIREBASE_OK){
    let answered = false;
    setTimeout(()=>{ if(!answered){ console.warn('Sem resposta do Firebase — a usar dados locais.'); localLoadUsers(); afterUsersLoaded(); } }, 5000);
    db.collection('staff').orderBy('name').onSnapshot(snap=>{
      answered = true;
      users = snap.docs.map(d=>({id:d.id, ...d.data()}));
      afterUsersLoaded();
    }, err=>{ answered = true; console.error(err); localLoadUsers(); afterUsersLoaded(); });
  } else {
    localLoadUsers(); afterUsersLoaded();
  }
}
let booted = false;
function afterUsersLoaded(){
  if(FIREBASE_OK && currentUser && !booted){
    authReady.then(u=>{
      if(u && currentUser){ booted = true; boot(); }
      else { currentUser = null; localStorage.removeItem('oficina_user'); loginState = users.length ? 'select' : 'bootstrap'; renderLogin(); }
    });
    return;
  }
  if(currentUser){ if(!booted){ booted = true; boot(); } return; } // already logged in this device
  loginState = users.length ? 'select' : 'bootstrap';
  renderLogin();
  if(document.getElementById('nav-team')) refreshTeamNavVisibility();
}

async function saveUserAccount(u){
  if(FIREBASE_OK){
    if(u.id){ const id=u.id; const copy={...u}; delete copy.id; await db.collection('staff').doc(id).set(copy,{merge:true}); return id; }
    const ref = await db.collection('staff').add(u); return ref.id;
  } else {
    if(u.id){ const idx=users.findIndex(x=>x.id===u.id); users[idx]=u; }
    else { u.id='local_user_'+Date.now(); users.push(u); }
    localSaveUsers();
    return u.id;
  }
}
async function deleteUserAccount(id){
  if(!isOwner()){ toast('Apenas o dono pode eliminar'); return; }

function renderPinDots(){
  const dots = document.getElementById('pin-dots');
  if(!dots) return;
  dots.innerHTML = Array.from({length:PIN_LEN}).map((_,i)=>`<span class="${i<pinBuffer.length?'filled':''}"></span>`).join('');
}
async function checkPin(){
  if(FIREBASE_OK){
    try{
      await auth.signInWithEmailAndPassword(selectedLoginUser.email, pinPass(pinBuffer));
      currentUser = {id:selectedLoginUser.id, name:selectedLoginUser.name, role:selectedLoginUser.role};
      localStorage.setItem('oficina_user', JSON.stringify(currentUser));
      booted = true; boot();
    }catch(err){
      console.warn(err);
      toast(err.code==='auth/too-many-requests' ? 'Demasiadas tentativas — aguarde uns minutos' : 'PIN incorreto');
      pinBuffer = ''; renderPinDots();
    }
    return;
  }
  if(pinBuffer === (selectedLoginUser.pin||'')){
    currentUser = {id:selectedLoginUser.id, name:selectedLoginUser.name, role:selectedLoginUser.role};
    localStorage.setItem('oficina_user', JSON.stringify(currentUser));
    boot();
  } else {
    toast('PIN incorreto');
    pinBuffer = '';
    renderPinDots();
  }
}

/* ===================== Swipe-back (mesmo gesto da app SalesReports) ===================== */
function goBack(){
  const overlays = document.querySelectorAll('.modal-overlay');
  if(overlays.length){
    const top = overlays[overlays.length-1];
    const x = top.querySelector('.close-x');
    if(x) x.click(); else top.remove();
    return;
  }
  if(document.getElementById('app').style.display === 'none'){
    const back = document.getElementById('pin-back');
    if(back) back.click();
    return;
  }
  if(currentView !== 'dashboard'){
    const b = document.querySelector('.navbtn[data-view="dashboard"]');
    if(b) b.click();
  }
}
(function(){
  let startX=0, startY=0, startTime=0, tracking=false;
  document.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    const t=e.touches[0];
    if(t.clientX>30){ tracking=false; return; }
    startX=t.clientX; startY=t.clientY; startTime=Date.now(); tracking=true;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!tracking) return; tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY, dt=Date.now()-startTime;
    if(dx>80 && Math.abs(dy)<60 && dt<700) goBack();
  }, {passive:true});
})();

/* ===================== Helpers ===================== */
function money(n){
  n = Math.round(Number(n)||0);
  const neg = n<0; n = Math.abs(n);
  return (neg?'-':'') + String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0') + ' Kz';
}
function calcTotals(v){
  const services = (v.services||[]).reduce((s,x)=>s+(Number(x.cost)||0),0);
  const parts = (v.parts||[]).reduce((s,x)=>s+((Number(x.cost)||0)*(Number(x.qty)||1)),0);
  const labor = Number(v.laborCost)||0;
  return {services, parts, labor, total: services+parts+labor};
}
/* Comprime fotos (telemóveis geram 3–10 MB; o Firebase só aceita ~1 MB por viatura) */
function compressImage(file, maxSide=800, quality=0.6){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('Não foi possível ler a foto'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Foto inválida'));
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        const k = Math.min(1, maxSide/Math.max(w,h));
        w = Math.round(w*k); h = Math.round(h*k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* Imprime só o documento (num iframe leve), em vez da app inteira — muito mais rápido no telemóvel */
function printDocument(overlay, title){
  const modal = overlay.querySelector('.modal').cloneNode(true);
  modal.querySelectorAll('.no-print').forEach(n=>n.remove());
  const css = Array.from(document.querySelectorAll('style')).map(x=>x.textContent).join('\n');
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  document.body.appendChild(iframe);
  const doc = iframe.contentDocument;
  doc.open();
  doc.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+css+'\nbody{background:#fff;color:#000;min-height:0;}.modal{border:none;max-width:100%;padding:0;border-radius:0;box-shadow:none;}</style></head><body></body></html>');
  doc.close();
  doc.body.appendChild(doc.importNode(modal, true));
  const imgs = Array.from(doc.images);
  const ready = Promise.all(imgs.map(im=> im.complete ? Promise.resolve() : new Promise(r=>{ im.onload = im.onerror = r; })));
  ready.then(()=>{
    setTimeout(()=>{
      try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){ window.print(); }
      setTimeout(()=>iframe.remove(), 60000);
    }, 50);
  });
}
const MAX_DOC_BYTES = 900000;
function docSize(o){ try{ return JSON.stringify(o).length; }catch(e){ return 0; } }
const SHOP = {name:'D.E.MOTORS', nif:'5001259431'};
const shopHeader = ()=>`<div style="font-size:13px;margin-bottom:14px;"><b>${SHOP.name}</b> · NIF: ${SHOP.nif}</div>`;
function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function isOwner(){ return !!currentUser && currentUser.role==='admin'; }
function canSeePrices(){ return !!currentUser && (currentUser.role==='admin' || currentUser.role==='recepcao'); }
function paidAmountOf(v){ return Math.max(0, Number(v.paidAmount)||0); }
function balanceOf(v){
  const total = calcTotals(v).total;
  const ps = v.paymentStatus || 'pending';
  if(ps==='paid') return 0;
  if(ps==='partial') return Math.max(0, total - paidAmountOf(v));
  return total;
}
function fmtDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-PT');
}
function statusInfo(key){ return STATUS.find(s=>s.key===key) || STATUS[0]; }

      ${dueCount? `<div style="cursor:pointer;" id="goto-reminders">🔧 <b>${dueCount}</b> lembrete(s) de manutenção próximos ou atrasados</div>`:''}
      ${lowCount? `<div style="cursor:pointer;" id="goto-inventory">📦 <b>${lowCount}</b> peça(s) com estoque baixo</div>`:''}
    </div>` : ''}
    <div class="board" id="board"></div>
  `;
  document.getElementById('new-car-btn').addEventListener('click', ()=>{ currentView='intake'; render(); });
  const gr = document.getElementById('goto-reminders'); if(gr) gr.addEventListener('click', ()=>{currentView='reminders'; render();});
  const gi = document.getElementById('goto-inventory'); if(gi) gi.addEventListener('click', ()=>{currentView='inventory'; render();});
  const board = document.getElementById('board');

/* ===================== Reports ===================== */
function renderReports(main){
  const delivered = vehicles.filter(v=>v.status==='delivered');
  const inShop = vehicles.filter(v=>v.status!=='delivered');
  const revenue = delivered.reduce((s,v)=>s+calcTotals(v).total,0);
  const pending = vehicles.reduce((s,v)=>s+balanceOf(v),0);
  const counts = {};
  vehicles.forEach(v=>{ const k=(v.reason||'—').slice(0,40); counts[k]=(counts[k]||0)+1; });
  const topReasons = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const mechStats = {};
  delivered.forEach(v=>{
    const m = v.mechanic || 'Sem mecânico atribuído';
    if(!mechStats[m]) mechStats[m] = {count:0, revenue:0};
    mechStats[m].count++;
    mechStats[m].revenue += calcTotals(v).total;
  });
  const mechRows = Object.entries(mechStats).sort((a,b)=>b[1].revenue-a[1].revenue);

  main.innerHTML = `
    <div class="pagehead"><h2>Relatórios</h2></div>
    <div class="grid3">
      <div class="panel"><div class="section-title">Viaturas na Oficina</div><div style="font-size:32px;font-weight:800;">${inShop.length}</div></div>
      ${canSeePrices() ? `<div class="panel"><div class="section-title">Total Entregue (histórico)</div><div style="font-size:32px;font-weight:800;color:var(--orange);">${money(revenue)}</div></div>
      <div class="panel"><div class="section-title">Pagamentos Pendentes</div><div style="font-size:32px;font-weight:800;color:var(--red);">${money(pending)}</div></div>` : ''}
    </div>
    <div class="panel">
      <div class="section-title">Motivos mais frequentes</div>
      ${topReasons.length? topReasons.map(([r,c])=>`<div class="hist-item" style="display:flex;justify-content:space-between;"><span>${r}</span><span>${c}</span></div>`).join('') : '<div class="empty-state">Sem dados ainda.</div>'}
    </div>
    ${isOwner() ? `<div class="panel">
      <div class="section-title">Desempenho por Mecânico</div>
      ${mechRows.length ? `<table><thead><tr><th>Mecânico</th><th>Viaturas Entregues</th><th>Receita Gerada</th></tr></thead><tbody>
        ${mechRows.map(([name,s])=>`<tr><td>${name}</td><td>${s.count}</td><td>${money(s.revenue)}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty-state">Sem viaturas entregues ainda.</div>'}
    </div>` : ''}
    ${isOwner() ? `<div class="panel">
      <div class="section-title">Cópia de Segurança (Backup)</div>
      <p style="font-size:13px;color:var(--text-dim);text-transform:none;margin-bottom:12px;">
        ${FIREBASE_OK ? 'Os seus dados já estão sincronizados online, mas pode exportar uma cópia local a qualquer momento.' : 'A app está a guardar os dados apenas neste telefone. Exporte uma cópia regularmente para não perder nada se limpar o navegador ou trocar de telefone.'}
      </p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" id="export-backup-btn">Exportar Dados (.json)</button>
        <button class="btn secondary" id="import-backup-btn">Importar Cópia de Segurança</button>
        <input type="file" id="import-backup-file" accept="application/json" style="display:none;">
      </div>
    </div>` : ''}
  `;
  if(isOwner()){
    document.getElementById('export-backup-btn').addEventListener('click', exportBackup);
    document.getElementById('import-backup-btn').addEventListener('click', ()=>document.getElementById('import-backup-file').click());
    document.getElementById('import-backup-file').addEventListener('change', importBackup);
  }
}

function exportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    vehicles, inventory, users,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `oficina-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado');
}

function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm(FIREBASE_OK
        ? `Isto vai ADICIONAR ${(data.vehicles||[]).length} viaturas, ${(data.inventory||[]).length} peças aos dados online existentes (os utilizadores não são importados) (não apaga nada). Continuar?`
        : `Isto vai substituir os dados atuais por: ${(data.vehicles||[]).length} viaturas, ${(data.inventory||[]).length} peças, ${(data.users||[]).length} utilizadores. Continuar?`
      )) return;
      if(FIREBASE_OK){
        for(const v of (data.vehicles||[])){ const copy={...v}; delete copy.id; await db.collection('vehicles').add(copy); }
        for(const i of (data.inventory||[])){ const copy={...i}; delete copy.id; await db.collection('inventory').add(copy); }
      } else {
        vehicles = data.vehicles || []; localSave();
        inventory = data.inventory || []; localSaveInv();
        users = data.users || []; localSaveUsers();
        render();
      }
      toast('Backup importado com sucesso');
    }catch(err){
      console.error(err);
      toast('Ficheiro inválido');
    }
  };
  reader.readAsText(file);
}

    <div class="section-title">Peças Utilizadas</div>
    <div id="parts-rows"></div>
    <button class="addrow-btn" id="add-part">+ Adicionar peça</button>

    <div class="grid2" style="margin-top:16px;">
      ${canSeePrices() ? `<div><label>Custo de Mão de Obra Adicional</label><input id="m-labor" type="number" value="${v.laborCost||0}" ${isOwner()?'':'readonly class="ro"'}></div>` : ''}
      <div><label>Mecânico Responsável</label><input id="m-mechanic" value="${esc(v.mechanic)}"></div>
    </div>

    ${canSeePrices() ? `<div class="totals-box" id="totals-box"></div>

    <div class="grid2" style="margin-top:16px;">
      <div><label>Estado do Pagamento</label>
        <select id="m-payment-status">
          <option value="pending" ${v.paymentStatus==='pending'?'selected':''}>Pendente</option>
          <option value="partial" ${v.paymentStatus==='partial'?'selected':''}>Parcial</option>
          <option value="paid" ${v.paymentStatus==='paid'?'selected':''}>Pago</option>
        </select>
      </div>
      <div><label>Método de Pagamento</label><input id="m-payment-method" value="${esc(v.paymentMethod)}"></div>
    </div>
    <div id="paid-wrap" style="margin-top:6px;${v.paymentStatus==='partial'?'':'display:none;'}">
      <div class="grid2">
        <div><label>Valor já pago (Kz)</label><input id="m-paid-amount" type="number" min="0" value="${paidAmountOf(v)}"></div>
        <div><label>Em falta</label><div id="m-balance" style="font-weight:700;padding:11px 0;"></div></div>
      </div>
    </div>` : ''}

    <div class="section-title">Fotos de Entrada</div>
    <div class="photo-thumbs">${(v.photos||[]).map(p=>`<img src="${p}">`).join('') || '<div style="color:var(--text-dim);font-size:13px;">Sem fotos.</div>'}</div>

    <div class="section-title">Fotos de Progresso</div>
    <div class="photo-thumbs" id="progress-photo-thumbs">${(v.progressPhotos||[]).map(p=>`<div class="photo-item"><img src="${p.url}"><div class="photo-cap">${fmtDate(p.date)}</div></div>`).join('')}</div>
    <input type="file" id="m-progress-photo" accept="image/*" multiple style="margin-top:8px;">

    <div class="section-title">Próxima Revisão / Manutenção</div>
    <div class="grid2">
      <div><label>Data prevista</label><input type="date" id="m-next-service" value="${v.nextServiceDate||''}"></div>
      <div><label>Quilometragem prevista</label><input id="m-next-service-km" value="${esc(v.nextServiceKm)}"></div>
    </div>

    <div class="section-title">Assinatura do Cliente (na entrega)</div>
    ${v.signature ? `<div class="photo-thumbs"><img src="${v.signature}" style="background:#fff;width:160px;height:auto;"></div>${isOwner() ? `<button class="btn small secondary no-print" id="redo-sig-btn" style="margin-top:8px;">Nova Assinatura</button>` : ''}` : `
    <div class="sig-wrap no-print"><canvas id="sig-pad" class="signature-pad"></canvas></div>
    <div class="no-print" style="margin-top:6px;display:flex;gap:8px;">
      <button class="btn small secondary" id="clear-sig-btn">Limpar</button>
      <button class="btn small" id="save-sig-btn">Guardar Assinatura</button>
    </div>`}

    <div class="section-title">Notas</div>
    <div id="notes-list">${(v.notes||[]).map(n=>`<div class="note-item">${esc(n.text)}<div class="meta">${esc(n.author)} · ${fmtDate(n.date)}</div></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <input id="new-note" placeholder="Escrever nota...">
      <button class="btn small" id="add-note-btn">Adicionar</button>
    </div>

    <div class="no-print" style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" id="save-modal-btn">Guardar</button>
      ${canSeePrices() ? `<button class="btn secondary" id="proforma-btn">Proforma (Orçamento)</button>
      <button class="btn secondary" id="invoice-btn">Ver Fatura / Exportar PDF</button>` : ''}
      <button class="btn secondary" id="report-btn">Relatório de Manutenção (PDF)</button>
      <button class="btn secondary" id="edit-full-btn">Editar Dados da Viatura</button>
      ${isOwner() ? `<button class="btn danger" id="delete-btn">Eliminar</button>` : ''}
    </div>
  </div>`;
  document.body.appendChild(overlay);

  let services = v.services ? JSON.parse(JSON.stringify(v.services)) : [];
  let parts = v.parts ? JSON.parse(JSON.stringify(v.parts)) : [];

  function renderServiceRows(){
    document.getElementById('services-rows').innerHTML = services.map((s,i)=>`
      <div class="row-item svc ${canSeePrices()?'':'nocost'}">
        <input data-i="${i}" class="svc-desc" placeholder="Descrição" value="${esc(s.desc)}">
        ${canSeePrices() ? `<input data-i="${i}" class="svc-cost ${isOwner()?'':'ro'}" type="number" placeholder="Custo" value="${s.cost||0}" ${isOwner()?'':'readonly'}>` : ''}
        ${isOwner() || !(s.desc||s.cost) || s._new ? `<button data-i="${i}" class="close-x svc-del" style="font-size:18px;">&times;</button>` : '<span></span>'}
      </div>`).join('');
    document.querySelectorAll('.svc-desc').forEach(el=>el.addEventListener('input', e=>{services[e.target.dataset.i].desc=e.target.value;}));
    document.querySelectorAll('.svc-cost').forEach(el=>el.addEventListener('input', e=>{services[e.target.dataset.i].cost=e.target.value; updateTotals();}));
    document.querySelectorAll('.svc-del').forEach(el=>el.addEventListener('click', e=>{services.splice(e.target.dataset.i,1); renderServiceRows(); updateTotals();}));
  }
  function renderPartRows(){
    document.getElementById('parts-rows').innerHTML = parts.map((p,i)=>`
      <div class="row-item prt ${canSeePrices()?'':'nocost'}">
        <input data-i="${i}" class="prt-name" placeholder="Nome da peça" value="${esc(p.name)}">
        <input data-i="${i}" class="prt-qty" type="number" placeholder="Qtd" value="${p.qty||1}">
        ${canSeePrices() ? `<input data-i="${i}" class="prt-cost ${isOwner()?'':'ro'}" type="number" placeholder="Custo unit." value="${p.cost||0}" ${isOwner()?'':'readonly'}>` : ''}
        ${isOwner() || p._new ? `<button data-i="${i}" class="close-x prt-del" style="font-size:18px;">&times;</button>` : '<span></span>'}
      </div>`).join('');
    document.querySelectorAll('.prt-name').forEach(el=>el.addEventListener('input', e=>{parts[e.target.dataset.i].name=e.target.value;}));
    document.querySelectorAll('.prt-qty').forEach(el=>el.addEventListener('input', e=>{parts[e.target.dataset.i].qty=e.target.value; updateTotals();}));
    document.querySelectorAll('.prt-cost').forEach(el=>el.addEventListener('input', e=>{parts[e.target.dataset.i].cost=e.target.value; updateTotals();}));
    document.querySelectorAll('.prt-del').forEach(el=>el.addEventListener('click', e=>{parts.splice(e.target.dataset.i,1); renderPartRows(); updateTotals();}));
  }
  function updateTotals(){
    const tb = document.getElementById('totals-box'); if(!tb) return;
    const laborEl = document.getElementById('m-labor');
    const labor = laborEl ? (Number(laborEl.value)||0) : (Number(v.laborCost)||0);
    const sTotal = services.reduce((s,x)=>s+(Number(x.cost)||0),0);
    const pTotal = parts.reduce((s,x)=>s+((Number(x.cost)||0)*(Number(x.qty)||1)),0);
    document.getElementById('totals-box').innerHTML = `
      <div class="totals-row"><span>Diagnóstico</span><span>${money(sTotal)}</span></div>
      <div class="totals-row"><span>Peças</span><span>${money(pTotal)}</span></div>
      <div class="totals-row"><span>Mão de obra adicional</span><span>${money(labor)}</span></div>
      <div class="totals-row grand"><span>Total</span><span>${money(sTotal+pTotal+labor)}</span></div>
    `;
  }
  renderServiceRows(); renderPartRows(); updateTotals();
  const _lab = document.getElementById('m-labor'); if(_lab) _lab.addEventListener('input', updateTotals);
  const _ps = document.getElementById('m-payment-status');
  function updateBalance(){
    if(!_ps) return;
    const pw = document.getElementById('paid-wrap'); pw.style.display = _ps.value==='partial' ? '' : 'none';
    const labor = _lab ? (Number(_lab.value)||0) : (Number(v.laborCost)||0);
    const total = services.reduce((a,x)=>a+(Number(x.cost)||0),0)+parts.reduce((a,x)=>a+((Number(x.cost)||0)*(Number(x.qty)||1)),0)+labor;
    const paid = Number(document.getElementById('m-paid-amount').value)||0;
    document.getElementById('m-balance').textContent = money(Math.max(0,total-paid));
  }
  if(_ps){ _ps.addEventListener('change', updateBalance); document.getElementById('m-paid-amount').addEventListener('input', updateBalance); document.querySelectorAll('.svc-cost,.prt-cost,.prt-qty').forEach(el=>el.addEventListener('input', updateBalance)); updateBalance(); }
  document.getElementById('add-service').addEventListener('click', ()=>{services.push({desc:'',cost:0,_new:true}); renderServiceRows();});
  document.getElementById('add-part').addEventListener('click', ()=>{parts.push({name:'',qty:1,cost:0,_new:true}); renderPartRows();});

  overlay.querySelector('.close-x').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  /* ---- Progress photos ---- */
  let pendingProgressPhotos = v.progressPhotos ? [...v.progressPhotos] : [];
  const progInput = document.getElementById('m-progress-photo');
  if(progInput){
    progInput.addEventListener('change', async (e)=>{
      const files = Array.from(e.target.files).slice(0, Math.max(0, 8 - pendingProgressPhotos.length));
      if(!files.length){ toast('Máximo de 8 fotos de progresso'); return; }
      toast('A processar fotos…');
      for(const file of files){
        try{ pendingProgressPhotos.push({url: await compressImage(file), date:Date.now()}); }catch(err){ toast(err.message); }
      }
      e.target.value = '';
      document.getElementById('progress-photo-thumbs').innerHTML = pendingProgressPhotos.map(p=>`<div class="photo-item"><img src="${p.url}"><div class="photo-cap">${fmtDate(p.date)}</div></div>`).join('');
    });
  }

  /* ---- Signature pad ---- */
  const sigCanvas = document.getElementById('sig-pad');
  if(sigCanvas){
    const ctx = sigCanvas.getContext('2d');
    function fitCanvas(){
      sigCanvas.width = sigCanvas.clientWidth;
      sigCanvas.height = sigCanvas.clientHeight;
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,sigCanvas.width,sigCanvas.height);
      ctx.strokeStyle = '#1A1D24'; ctx.lineWidth = 2; ctx.lineCap='round';
    }
    fitCanvas();
    let drawing=false;
    function pos(e){
      const r = sigCanvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return {x:p.clientX-r.left, y:p.clientY-r.top};
    }
    function start(e){ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
    function move(e){ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
    function end(){ drawing=false; }
    sigCanvas.addEventListener('mousedown', start);
    sigCanvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    sigCanvas.addEventListener('touchstart', start);
    sigCanvas.addEventListener('touchmove', move);
    sigCanvas.addEventListener('touchend', end);
    document.getElementById('clear-sig-btn').addEventListener('click', fitCanvas);
    document.getElementById('save-sig-btn').addEventListener('click', async ()=>{
      const dataUrl = sigCanvas.toDataURL('image/png');
      await saveVehicle({...v, signature: dataUrl});
      toast('Assinatura guardada');
      overlay.remove(); openVehicleModal(id);
    });
  }
  const redoSigBtn = document.getElementById('redo-sig-btn');
  if(redoSigBtn){
    redoSigBtn.addEventListener('click', async ()=>{
      await saveVehicle({...v, signature:''});
      overlay.remove(); openVehicleModal(id);
    });
  }

  document.getElementById('add-note-btn').addEventListener('click', async ()=>{
    const text = document.getElementById('new-note').value.trim();
    if(!text) return;
    const notes = v.notes||[];
    notes.push({text, author:currentUser.name, date:Date.now()});
    await saveVehicle({...v, notes});
    toast('Nota adicionada');
    overlay.remove(); openVehicleModal(id);
  });

  document.getElementById('save-modal-btn').addEventListener('click', async ()=>{
    const newNextServiceDate = document.getElementById('m-next-service').value;
    const updated = {
      ...v,
      status: document.getElementById('m-status').value,
      diagnosis: document.getElementById('m-diagnosis').value,
      services: services.map(({_new, ...x})=>x), parts: parts.map(({_new, ...x})=>x),
      laborCost: _lab ? _lab.value : (v.laborCost||0),
      mechanic: document.getElementById('m-mechanic').value,
      paymentStatus: _ps ? _ps.value : (v.paymentStatus||'pending'),
      paymentMethod: _ps ? document.getElementById('m-payment-method').value : (v.paymentMethod||''),
      paidAmount: _ps ? (_ps.value==='paid' ? calcTotals({services, parts, laborCost: _lab?_lab.value:v.laborCost}).total : (_ps.value==='partial' ? (Number(document.getElementById('m-paid-amount').value)||0) : 0)) : (v.paidAmount||0),
      progressPhotos: pendingProgressPhotos,
      nextServiceDate: newNextServiceDate,
      nextServiceKm: document.getElementById('m-next-service-km').value,
      reminderDone: newNextServiceDate !== v.nextServiceDate ? false : (v.reminderDone||false),
    };
    await saveVehicle(updated);
    updateRemindersBadge();
    toast('Guardado');
    overlay.remove();
  });

  document.getElementById('edit-full-btn').addEventListener('click', ()=>{
    overlay.remove();
    currentView='intake-edit';
    document.getElementById('main').innerHTML='';
    renderIntakeForm(document.getElementById('main'), v);
  });

  const _delBtn = document.getElementById('delete-btn');
  if(_delBtn) _delBtn.addEventListener('click', async ()=>{
    if(!isOwner()) return;
    if(confirm('Eliminar esta viatura e todo o seu histórico? Esta ação não pode ser desfeita.')){
      await deleteVehicle(id);
      overlay.remove();
      toast('Viatura eliminada');
    }
  });

  const _pf = document.getElementById('proforma-btn'), _inv = document.getElementById('invoice-btn');
  const curPay = ()=>({status: _ps ? _ps.value : (v.paymentStatus||'pending'), paid: Number((document.getElementById('m-paid-amount')||{}).value)||0, method: (document.getElementById('m-payment-method')||{}).value||''});
  if(_pf) _pf.addEventListener('click', ()=>{ openInvoice(v, services, parts, _lab.value, 'proforma', curPay()); });
  if(_inv) _inv.addEventListener('click', ()=>{ openInvoice(v, services, parts, _lab.value, 'invoice', curPay()); });
  document.getElementById('report-btn').addEventListener('click', ()=>{
    openMaintenanceReport(v, services, parts, pendingProgressPhotos);
  });
}

/* ===================== Invoice ===================== */
function openInvoice(v, services, parts, labor, mode, pay){
  const isPro = mode === 'proforma';
  pay = pay || {status: v.paymentStatus||'pending', paid: paidAmountOf(v), method: v.paymentMethod||''};
  const sTotal = services.reduce((s,x)=>s+(Number(x.cost)||0),0);
  const pTotal = parts.reduce((s,x)=>s+((Number(x.cost)||0)*(Number(x.qty)||1)),0);
  const laborN = Number(labor)||0;
  const grand = sTotal+pTotal+laborN;
  const now = new Date();
  const pad2 = n=>String(n).padStart(2,'0');
  const docNo = (isPro?'PF':'FT') + '-' + String(v.plate||'').toUpperCase().replace(/[^A-Z0-9]/g,'') + '-' + pad2(now.getDate()) + pad2(now.getMonth()+1) + String(now.getFullYear()).slice(2);
  const validUntil = new Date(now.getTime() + 15*86400000).toLocaleDateString('pt-PT');
  const paidN = pay.status==='paid' ? grand : (pay.status==='partial' ? Math.min(grand, Number(pay.paid)||0) : 0);
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <div class="no-print" style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;">
      <button class="btn small print-doc">Exportar PDF</button>
      <button class="btn small secondary close-inv">Fechar</button>
    </div>
    <img src="${document.querySelector('.top-logo').src}" alt="DE.MOTORS" style="height:34px;width:auto;display:block;margin-bottom:8px;">
    ${shopHeader()}
    <h1 style="color:var(--orange);">${isPro ? 'FATURA PROFORMA' : 'FATURA'}</h1>
    <div style="color:var(--text-dim);font-size:13px;margin-bottom:20px;">Nº ${docNo} · Data: ${now.toLocaleDateString('pt-PT')}${isPro ? ' · Válida até ' + validUntil : ''}</div>
    <div class="grid2">
      <div><label>Cliente</label><div>${esc(v.ownerName)||'—'}</div></div>
      <div><label>Telefone</label><div>${esc(v.ownerPhone)||'—'}</div></div>
    </div>
    <div class="grid2">
      <div><label>Viatura</label><div>${esc(v.make)} ${esc(v.model)}${v.year?' ('+esc(v.year)+')':''}</div></div>
      <div><label>Matrícula</label><div>${esc(v.plate)}</div></div>
    </div>
    <div class="section-title">Diagnóstico</div>
    <table><thead><tr><th>Descrição</th><th>Valor</th></tr></thead><tbody>
      ${services.map(s=>`<tr><td>${esc(s.desc)||'—'}</td><td>${money(s.cost)}</td></tr>`).join('') || '<tr><td colspan="2">—</td></tr>'}
    </tbody></table>
    <div class="section-title">Peças</div>
    <table><thead><tr><th>Peça</th><th>Qtd</th><th>Unit.</th><th>Subtotal</th></tr></thead><tbody>
      ${parts.map(p=>`<tr><td>${esc(p.name)||'—'}</td><td>${p.qty||1}</td><td>${money(p.cost)}</td><td>${money((Number(p.cost)||0)*(Number(p.qty)||1))}</td></tr>`).join('') || '<tr><td colspan="4">—</td></tr>'}
    </tbody></table>
    <div class="totals-box">
      <div class="totals-row"><span>Diagnóstico</span><span>${money(sTotal)}</span></div>
      <div class="totals-row"><span>Peças</span><span>${money(pTotal)}</span></div>
      <div class="totals-row"><span>Mão de obra adicional</span><span>${money(laborN)}</span></div>
      <div class="totals-row grand"><span>TOTAL</span><span>${money(grand)}</span></div>
    </div>
    ${isPro
      ? `<div style="margin-top:20px;font-size:12px;color:var(--text-dim);">Este documento é uma proforma (orçamento) e não serve como fatura nem comprovativo de pagamento. Os valores podem ser ajustados após o diagnóstico final.</div>
         <div style="margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:30px;font-size:12px;color:var(--text-dim);"><div style="border-top:1px solid var(--border-strong);padding-top:6px;">Oficina</div><div style="border-top:1px solid var(--border-strong);padding-top:6px;">Cliente (aceito)</div></div>`
      : `<div style="margin-top:20px;font-size:13px;">
         <div><b>Estado do pagamento:</b> ${pay.status==='paid'?'Pago':pay.status==='partial'?'Parcial':'Pendente'}${pay.method?' · '+esc(pay.method):''}</div>
         ${pay.status==='partial' ? `<div>Valor pago: ${money(paidN)} · Em falta: <b>${money(Math.max(0,grand-paidN))}</b></div>` : ''}
         ${pay.status==='pending' ? `<div>Valor a pagar: <b>${money(grand)}</b></div>` : ''}
       </div>`}
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close-inv').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('.print-doc').addEventListener('click', ()=>printDocument(overlay, docNo));
}

/* ===================== Maintenance Report ===================== */
function openMaintenanceReport(v, services, parts, progressPhotos){
  const s = statusInfo(v.status);
  const allPhotos = [
    ...(v.photos||[]).map(url=>({url, label:'Entrada'})),
    ...((progressPhotos||v.progressPhotos)||[]).map(p=>({url:p.url, label:fmtDate(p.date)})),
  ];
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <div class="no-print" style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;">
      <button class="btn small print-doc">Exportar PDF</button>
      <button class="btn small secondary close-rep">Fechar</button>
    </div>
    <img src="${document.querySelector('.top-logo').src}" alt="DE.MOTORS" style="height:34px;width:auto;display:block;margin-bottom:8px;">
    ${shopHeader()}
    <h1 style="color:var(--orange);">RELATÓRIO DE MANUTENÇÃO</h1>
    <div style="color:var(--text-dim);text-transform:none;font-size:13px;margin-bottom:20px;">Emitido em: ${new Date().toLocaleDateString('pt-PT')}</div>

    <div class="grid2">
      <div><label>Cliente</label><div>${esc(v.ownerName)||'—'}</div></div>
      <div><label>Telefone</label><div>${esc(v.ownerPhone)||'—'}</div></div>
    </div>
    <div class="grid3">
      <div><label>Viatura</label><div>${esc(v.make)} ${esc(v.model)}${v.year?' ('+esc(v.year)+')':''}</div></div>
      <div><label>Matrícula</label><div>${esc(v.plate)}</div></div>
      <div><label>Quilometragem na entrada</label><div>${esc(v.mileage)||'—'}</div></div>
    </div>
    <div class="grid3">
      <div><label>Data de Entrada</label><div>${fmtDate(v.dateIn)}</div></div>
      <div><label>Data de Entrega</label><div>${v.status==='delivered'? (v.expectedDate?fmtDate(v.expectedDate):new Date().toLocaleDateString('pt-PT')) : '— (ainda na oficina)'}</div></div>
      <div><label>Estado Atual</label><div>${s.label}</div></div>
    </div>

    <div class="section-title">Motivo da Visita</div>
    <div style="font-size:14px;">${esc(v.reason)||'—'}</div>

    <div class="section-title">Observações do Diagnóstico</div>
    <div style="font-size:14px;">${esc(v.diagnosis)||'—'}</div>

    <div class="section-title">Diagnóstico Realizado</div>
    <table><thead><tr><th>Descrição</th></tr></thead><tbody>
      ${services.length? services.map(x=>`<tr><td>${esc(x.desc)||'—'}</td></tr>`).join('') : '<tr><td>Nenhum diagnóstico registado.</td></tr>'}
    </tbody></table>

    <div class="section-title">Peças Substituídas</div>
    <table><thead><tr><th>Peça</th><th>Qtd.</th></tr></thead><tbody>
      ${parts.length? parts.map(p=>`<tr><td>${esc(p.name)||'—'}</td><td>${p.qty||1}</td></tr>`).join('') : '<tr><td colspan="2">Nenhuma peça registada.</td></tr>'}
    </tbody></table>

    <div class="grid2">
      <div><label>Mecânico Responsável</label><div>${esc(v.mechanic)||'—'}</div></div>
      <div><label>Próxima Revisão Recomendada</label><div>${v.nextServiceDate? fmtDate(v.nextServiceDate) : (v.nextServiceKm? v.nextServiceKm+' km' : '—')}</div></div>
    </div>

    ${(v.notes && v.notes.length) ? `<div class="section-title">Notas da Equipa</div>
      ${v.notes.map(n=>`<div style="font-size:13px;margin-bottom:6px;">• ${esc(n.text)} <span style="color:var(--text-dim);">(${esc(n.author)}, ${fmtDate(n.date)})</span></div>`).join('')}` : ''}

    ${allPhotos.length ? `<div class="section-title">Registo Fotográfico</div>
      <div class="photo-thumbs">${allPhotos.map(p=>`<div class="photo-item"><img src="${p.url}" style="width:100px;height:100px;"><div class="photo-cap">${p.label}</div></div>`).join('')}</div>` : ''}

    ${v.signature ? `<div class="section-title">Assinatura do Cliente</div><img src="${v.signature}" style="background:#fff;width:180px;height:auto;border:1px solid var(--border);">` : ''}
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close-rep').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('.print-doc').addEventListener('click', ()=>printDocument(overlay, 'Relatorio-' + String(v.plate||'').toUpperCase().replace(/[^A-Z0-9]/g,'')));
}

window.addEventListener('unhandledrejection', e=>{
  const r = e.reason || {};
  if(r.message === 'doc-too-large') return;
  console.error(r);
  toast('Erro ao guardar: ' + (r.code || r.message || 'tente novamente'));
});

/* ===================== Boot ===================== */
subscribeUsers();
</script>
<script>document.addEventListener('contextmenu',function(e){var t=e.target;if(!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]')))e.preventDefault();});document.addEventListener('selectstart',function(e){var t=e.target&&e.target.nodeType===1?e.target:e.target.parentElement;if(!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]')))e.preventDefault();});</script>
</body>
</html>
